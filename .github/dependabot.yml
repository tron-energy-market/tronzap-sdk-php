version: 2

updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ['*']
    commit-message:
      prefix: ci

  - package-ecosystem: composer
    directory: /
    schedule:
      interval: weekly
    ignore:
      # PHPUnit 10 and newer need PHP 8.1, and the SDK is tested on PHP 7.4.
      - dependency-name: phpunit/phpunit
        update-types: ['version-update:semver-major']
    groups:
      development-dependencies:
        patterns: ['*']
    commit-message:
      prefix: chore
